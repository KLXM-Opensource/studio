# KLXM Studio – fail2ban-Filter für das Zugriffslog des Webservers (Plesk: /var/www/vhosts/<domain>/logs/proxy_access_ssl_log):
# Abfragen nicht vorhandener .php-Dateien typischer anderer Systeme (/wp-login.php, /xmlrpc.php, PHPUnit …). Solche Anfragen
# beantwortet der Webserver selbst mit 404 – sie erreichen KLXM Studio nie und stehen daher nicht in storage/logs/security.log.
# Nur 404/403 zählen: eine WordPress-Website auf demselben Server (Antwort 200) wird nicht erfasst.
# Achtung: Websites hinter Cloudflare o. Ä. – deren Adressen unter ignoreip eintragen, sonst wird der Proxy gesperrt.

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "[A-Z]+ /(?:[^" ?]*/)?(?:wp-login|xmlrpc|wp-config|setup-config|wp-cron|eval-stdin|wlwmanifest)\.(?:php|xml)[^"]*" (?:404|403) 
ignoreregex =

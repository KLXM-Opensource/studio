# KLXM Studio – fail2ban-Filter: fehlgeschlagene Anmeldungen, zweiter Faktor, Passwort vergessen, API-Schlüssel
# Quelle: storage/logs/security.log (Core\SecurityLog, Konfiguration 'security_log' => true)
# Zeile: 2026-10-23T01:30:00+02:00 klxm-studio auth-failed ip=203.0.113.7 site=default path=/admin/login
# Prüfen: fail2ban-regex /var/www/vhosts/<domain>/httpdocs/storage/logs/security.log /etc/fail2ban/filter.d/klxm-studio-auth.conf

[Definition]
failregex = ^\S+ klxm-studio (?:auth-failed|auth-limited|2fa-failed|passkey-failed|reset-limited|api-key-invalid) ip=<HOST>(?: |$)
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S

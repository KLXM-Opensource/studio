# KLXM Studio – fail2ban-Filter: Abfragen typischer Angriffsadressen (/wp-login.php, /xmlrpc.php, /.env, /.git/ …),
# die es in KLXM Studio nicht gibt – nur ohne passende Weiterleitung (alte Links umgezogener Websites zählen nicht).
# Quelle: storage/logs/security.log (Core\SecurityLog, Konfiguration 'security_log' => true)

[Definition]
failregex = ^\S+ klxm-studio probe ip=<HOST>(?: |$)
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S

# KLXM Studio – Website aus einem anderen Plesk-Abonnement desselben Servers ausliefern
#
# Die Domain (hier kunde.example.org) bleibt im Abonnement des Kunden: E-Mail, DNS, SSL-Zertifikat, FTP bleiben dort.
# Nur Webanfragen gehen an die KLXM-Studio-Installation (hier studio.example.org). Studio übernimmt Domain, https und
# Besucher-IP aus den X-Forwarded-Köpfen (Core\Http\Forwarded) – nur von vertrauenswürdigen Proxys (Loopback, private Adressen,
# 'trusted_proxies'). Entwicklerhandbuch → Websites → „Website aus einem anderen Abonnement“.
#
# 1. Studio: Domain der Website hinzufügen     php bin/console site:hosts <key> add kunde.example.org
#    (als Hauptadresse: Verwaltung bzw. Netzwerk-Übersicht; Grundeinstellungen → Kanonische Adresse https://kunde.example.org)
# 2. Plesk (Admin): Abonnement des Kunden → Websites & Domains → kunde.example.org → „Apache & nginx“
#    → „Zusätzliche nginx-Anweisungen“: den Block unten einfügen, Studio-Domain anpassen, Übernehmen.
# 3. Prüfen: https://kunde.example.org/health – und die Website im Browser.
#
# Wichtig
# - proxy_pass und Host zeigen auf die STUDIO-Domain, nie auf die Kunden-Domain (sonst Schleife).
# - Regex-Location statt „location /“: Plesk legt „location /“ selbst an (doppelt = Fehler beim Übernehmen); der Regex
#   gewinnt gegen das Präfix. /.well-known/acme-challenge/ bleibt beim Kunden (Let's Encrypt verlängert weiter).
# - Weitere Pfade, die im Webspace des Kunden bleiben sollen, in die Klammer aufnehmen: (?!\.well-known/acme-challenge/|shop/)
# - client_max_body_size mindestens so groß wie die Upload-Grenze von Studio.
# - „Proxy-Modus“ (nginx → Apache) im Abonnement des Kunden an lassen. Ohne ihn (PHP direkt über nginx) steht Plesks eigene
#   Regex-Location für .php vor dieser und würde Adressen auf .php im Webspace des Kunden ausführen.

location ~ ^/(?!\.well-known/acme-challenge/) {
    proxy_pass https://studio.example.org;
    proxy_ssl_server_name on;
    proxy_set_header Host studio.example.org;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;
    proxy_read_timeout 300s;
    client_max_body_size 256m;
}
